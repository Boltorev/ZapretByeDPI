# ---------------------------------------------------------------------------
# Параметры Gradle для проекта.
# ---------------------------------------------------------------------------

# Память для Gradle-демона. 2 ГБ с запасом хватает для этапа 1.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Проект использует AndroidX (AppCompat, Material, Lifecycle, Coroutines).
android.useAndroidX=true

# Каждый модуль генерирует только свой R-класс — быстрее сборка.
android.nonTransitiveRClass=true

# Официальный стиль кода Kotlin.
kotlin.code.style=official
