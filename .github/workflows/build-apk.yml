name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # На образе ubuntu-latest Android SDK уже есть (ANDROID_HOME,
      # platforms;android-34, build-tools;35.0.0), но sdkmanager не всегда
      # попадает в PATH, а предустановленный NDK — 27.3, тогда как проект
      # собран под 27.0.12077973. Поэтому sdkmanager ищем вручную, а NDK
      # доставляем сами. Сторонние actions для SDK не используем.
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "${ANDROID_HOME}/cmdline-tools" || true
          find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f || true

      - name: Install NDK 27.0.12077973
        run: |
          set -e
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден в ${ANDROID_HOME}/cmdline-tools" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "ndk;27.0.12077973" \
            "platforms;android-34" \
            "build-tools;35.0.0"
          echo "NDK dirs:" && ls "${ANDROID_HOME}/ndk"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Show APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapretByeDPI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
